<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ post.title }} - N890GF Logbook</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #2c3e50;
            --meta-color: #7f8c8d;
            --accent-color: #3498db;
            --border-color: #ecf0f1;
        }

        body {
            font-family: 'Georgia', serif; /* Serif fonts are better for long-form reading */
            line-height: 1.8;
            color: var(--text-color);
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
        }

        .post-container {
            max-width: 800px;
            margin: 60px auto;
            background: var(--bg-color);
            padding: 50px;
            border-radius: 8px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.05);
        }

        header { margin-bottom: 40px; border-bottom: 2px solid var(--border-color); padding-bottom: 20px; }

        h1 { font-size: 2.5rem; margin-bottom: 10px; line-height: 1.2; color: #1a1a1a; }

        .post-meta { font-family: sans-serif; font-size: 0.9rem; color: var(--meta-color); }
        .category-link { color: var(--accent-color); text-decoration: none; font-weight: bold; }

        /* --- CONTENT STYLING --- */
        /* These styles ensure the HTML from the JS editor looks good */
        .post-content img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            margin: 20px 0;
            display: block;
        }

        .post-content blockquote {
            border-left: 5px solid var(--accent-color);
            padding-left: 20px;
            margin: 30px 0;
            font-style: italic;
            color: #555;
        }

        .post-content pre {
            background: #2d3436;
            color: #dfe6e9;
            padding: 20px;
            border-radius: 5px;
            overflow-x: auto;
            font-family: 'Courier New', Courier, monospace;
        }

        /* --- FOOTER --- */
        footer { margin-top: 50px; padding-top: 20px; border-top: 1px solid var(--border-color); font-family: sans-serif; }
        .tags { margin-bottom: 20px; }
        .tag-badge {
            display: inline-block;
            background: #eee;
            padding: 4px 10px;
            border-radius: 4px;
            margin-right: 5px;
            font-size: 0.8rem;
            color: #666;
        }

        .nav-links { display: flex; justify-content: space-between; margin-top: 30px; }
        .nav-links a { color: var(--accent-color); text-decoration: none; font-weight: bold; }

        @media (max-width: 600px) {
            .post-container { padding: 25px; margin: 20px; }
            h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <article class="post-container">
        <header>
            <div class="post-meta">
                {{ post.created_at.strftime('%B %d, %Y') }} —
                In <a href="{{ url_for('index', category=post.category.name) }}" class="category-link">{{ post.category.name }}</a>
            </div>
            <h1>{{ post.title }}</h1>
        </header>

        <div class="post-content">
            {{ post.content | safe }}
        </div>

        <footer>
            {% if post.tags %}
            <div class="tags">
                <strong>Tagged as:</strong><br>
                {% for tag in post.tags %}
                    <span class="tag-badge">#{{ tag.name }}</span>
                {% endfor %}
            </div>
            {% endif %}

            <div class="nav-links">
                <a href="{{ url_for('index') }}">&larr; Back to Feed</a>
                {% if current_user.is_authenticated %}
                    <a href="{{ url_for('edit_post', post_id=post.id) }}" style="color: var(--accent-color);">Edit Post</a>
                {% endif %}
            </div>
        </footer>
    </article>

</body>
</html>
