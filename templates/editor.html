<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if post %}Edit{% else %}New{% endif %} Post - Admin Dashboard</title>

    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">

    <style>
        :root {
            --bg: #f4f7f6;
            --text: #333;
            --white: #ffffff;
            --primary: #007bff;
            --border: #ced4da;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            margin: 0;
            padding: 20px;
            color: var(--text);
        }

        .editor-container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--white);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        h2 { margin-top: 0; color: #1a1a1a; border-bottom: 2px solid var(--bg); padding-bottom: 15px; }

        .form-group { margin-bottom: 25px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; color: #555; }

        input[type="text"], select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: var(--primary);
        }

        /* Set Editor Height and Style */
        #editor-wrapper { margin-bottom: 25px; }
        #editor {
            height: 450px;
            border-radius: 0 0 6px 6px;
            font-size: 1.1rem;
        }
        .ql-toolbar { border-radius: 6px 6px 0 0; background: #fafafa; }

        .btn-group { display: flex; gap: 15px; align-items: center; }

        .submit-btn {
            background: #28a745;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
            flex-grow: 2;
            transition: background 0.2s, transform 0.1s;
        }

        .submit-btn:hover { background: #218838; }
        .submit-btn:active { transform: scale(0.98); }

        .back-link {
            display: inline-block;
            color: #6c757d;
            text-decoration: none;
            font-size: 0.9rem;
            margin-top: 20px;
        }
        .back-link:hover { color: var(--primary); }

        /* Notification for image upload */
        #upload-status {
            font-size: 0.85rem;
            margin-top: 5px;
            color: var(--primary);
            display: none;
        }
    </style>
</head>
<body>

<div class="editor-container">
    <h2>{% if post %}Edit Post{% else %}Create New Entry{% endif %}</h2>

    <form id="post-form" method="POST" action="{% if post %}{{ url_for('edit_post', post_id=post.id) }}{% else %}{{ url_for('new_post') }}{% endif %}">

        <div class="form-group">
            <label for="title">Post Title</label>
            <input type="text" name="title" id="title" placeholder="What is this post about?" value="{{ post.title if post else '' }}" required>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <div class="form-group">
                <label>Categories</label>
                <div id="category-checklist" style="border: 1px solid #ddd; padding: 15px; border-radius: 6px; max-height: 200px; overflow-y: auto;">
                    {% for cat in categories %}
                        <div class="cat-item">
                            <input type="checkbox" name="categories" value="{{ cat.id }}"
                                {% if post and cat in post.categories %}checked{% endif %}>
                            <strong>{{ cat.name }}</strong>

                            {# Render Subcategories #}
                            {% if cat.subcategories %}
                                <div style="margin-left: 25px; border-left: 1px solid #eee; padding-left: 10px;">
                                {% for sub in cat.subcategories %}
                                    <div>
                                        <input type="checkbox" name="categories" value="{{ sub.id }}"
                                            {% if post and sub in post.categories %}checked{% endif %}>
                                        {{ sub.name }}
                                    </div>
                                {% endfor %}
                                </div>
                            {% endif %}
                        </div>
                    {% endfor %}
                </div>
            </div>

            <div class="form-group">
                <label for="tags">Tags (comma separated)</label>
                <input type="text" name="tags" id="tags" placeholder="e.g. dev, n890gf, updates" value="{{ tag_string if post else '' }}">
            </div>
        </div>

        <div class="form-group" id="editor-wrapper">
            <label>Content</label>
            <div id="editor"></div>
            <div id="upload-status">Uploading image...</div>
            <input type="hidden" name="content" id="content-input">
        </div>

        <div class="btn-group">
            <button type="submit" class="submit-btn">
                {% if post %}Update Post{% else %}Publish Post{% endif %}
            </button>
        </div>
    </form>

    <a href="{{ url_for('index') }}" class="back-link">&larr; Cancel and return to home</a>
</div>

<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>

<script>
    // 1. Setup Toolbar Options
    const toolbarOptions = [
        [{ 'header': [1, 2, 3, false] }],
        ['bold', 'italic', 'underline', 'strike'],
        ['blockquote', 'code-block'],
        [{ 'list': 'ordered'}, { 'list': 'bullet' }],
        ['link', 'image'],
        ['clean']
    ];

    // 2. Initialize Editor
    var quill = new Quill('#editor', {
        theme: 'snow',
        modules: {
            toolbar: {
                container: toolbarOptions,
                handlers: {
                    image: imageHandler
                }
            }
        }
    });

    // 3. Load Existing Content (if editing)
    {% if post %}
        // Safe injection of HTML from the server
        quill.root.innerHTML = {{ post.content | tojson }};
    {% endif %}

    // 4. Async Image Upload Handler
    function imageHandler() {
        const input = document.createElement('input');
        input.setAttribute('type', 'file');
        input.setAttribute('accept', 'image/*');
        input.click();

        input.onchange = () => {
            const file = input.files[0];
            const formData = new FormData();
            formData.append('file', file);

            const status = document.getElementById('upload-status');
            status.style.display = 'block';

            fetch('/admin/upload_media', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(result => {
                status.style.display = 'none';
                if (result.url) {
                    const range = quill.getSelection();
                    quill.insertEmbed(range.index, 'image', result.url);
                } else {
                    alert('Upload failed: ' + result.error);
                }
            })
            .catch(err => {
                status.style.display = 'none';
                console.error('Upload Error:', err);
            });
        };
    }

    // 5. Category Switching Logic
    const categorySelect = document.getElementById('category');
    const newCategoryInput = document.getElementById('new-category-input');

    categorySelect.addEventListener('change', function() {
        if (this.value === 'custom') {
            newCategoryInput.style.display = 'block';
            newCategoryInput.required = true;
        } else {
            newCategoryInput.style.display = 'none';
            newCategoryInput.required = false;
        }
    });

    // 6. Form Submission Preparation
    const form = document.getElementById('post-form');
    form.onsubmit = function() {
        // Sync Quill HTML to hidden input
        const contentInput = document.getElementById('content-input');
        contentInput.value = quill.root.innerHTML;

        // Verify content isn't empty
        if (quill.getText().trim().length === 0 && quill.root.innerHTML.indexOf('<img') === -1) {
            alert('Post content cannot be empty.');
            return false;
        }

        // Handle custom category naming
        if (categorySelect.value === 'custom') {
            const options = categorySelect.options;
            for (let i = 0; i < options.length; i++) {
                if (options[i].value === 'custom') {
                    options[i].value = newCategoryInput.value;
                }
            }
        }

        return true;
    };
</script>

</body>
</html>
