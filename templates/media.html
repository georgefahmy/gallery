<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Media Library - Admin</title>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; }

        .upload-section { border: 2px dashed #ccc; padding: 20px; text-align: center; margin-bottom: 30px; }

        .media-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .media-card { border: 1px solid #ddd; border-radius: 4px; overflow: hidden; background: #fff; text-align: center; }
        .media-card img { width: 100%; height: 120px; object-fit: cover; }
        .media-info { padding: 10px; font-size: 0.8rem; }

        .copy-btn {
            background: #007bff; color: white; border: none; padding: 5px 10px;
            border-radius: 3px; cursor: pointer; margin-top: 5px; width: 100%;
        }
        .copy-btn:hover { background: #0056b3; }

        .back-link { display: inline-block; margin-bottom: 20px; text-decoration: none; color: #666; }
    </style>
</head>
<body>

<div class="container">
    <a href="{{ url_for('index') }}" class="back-link">&larr; Back to Home</a>
    <h2>Media Library</h2>

    {% with messages = get_flashed_messages() %}
        {% if messages %}<p style="color: green;">{{ messages[0] }}</p>{% endif %}
    {% endwith %}

    <div class="upload-section">
        <form method="POST" enctype="multipart/form-data">
            <input type="file" name="file" required>
            <button type="submit" style="padding: 5px 15px;">Upload to Library</button>
        </form>
    </div>

    <div class="media-grid">
        {% for item in media_items %}
        <div class="media-card">
            <img src="{{ url_for('static', filename='uploads/' + item.filename) }}" alt="{{ item.filename }}">
            <div class="media-info">
                <div style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{ item.filename }}</div>
                <button class="copy-btn" onclick="copyUrl('{{ url_for('static', filename='uploads/' + item.filename, _external=True) }}')">
                    Copy URL
                </button>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

<script>
    function copyUrl(url) {
        navigator.clipboard.writeText(url).then(() => {
            alert("URL copied to clipboard!");
        });
    }
</script>

</body>
</html>
