<!DOCTYPE html>
<html>
<head>
    <title>Create New User</title>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; background: #f4f4f9; margin: 0;}
        .register-box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; width: 300px;}
        input { display: block; width: 100%; margin: 10px 0; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;}
        button { width: 100%; padding: 10px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px;}
        button:hover { opacity: 0.9; }
        .cancel-link { display: inline-block; margin-top: 15px; color: #007bff; text-decoration: none; font-size: 0.9rem; }
        .cancel-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="register-box">
        <h2>Create New User</h2>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <p style="color: red; font-size: 0.9rem;">{{ messages[0] }}</p>
            {% endif %}
        {% endwith %}
        <form method="POST">
            <input type="text" name="username" placeholder="New Username" required>
            <input type="password" name="password" placeholder="New Password" required>
            <button type="submit">Create Account</button>
        </form>
        <a href="{{ url_for('index') }}" class="cancel-link">Cancel and return to Gallery</a>
    </div>
</body>
</html>
