{% extends "base.html" %}

{% block content %}
    <h2>Recent Activity</h2>
    <div class="post-list">
        {% for post in posts %}
            <article>
                <h3><a href="{{ url_for('view_post', slug=post.slug) }}">{{ post.title }}</a></h3>
                <p>{{ post.content | striptags | truncate(200) }}</p>
            </article>
        {% endfor %}
    </div>
{% endblock %}
